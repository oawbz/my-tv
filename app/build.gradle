plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lizongying.mytv'
    compileSdk 34

    viewBinding {
        enabled = true
    }

    defaultConfig {
        applicationId "com.lizongying.mytv"
        minSdk 18
        multiDexEnabled true
        targetSdk 33
        versionCode project.findProperty('tvVersionCode')?.toInteger() ?: VersionCode()
        versionName project.findProperty('tvVersionName')?.toString() ?: VersionName()

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = 17
    }

}

static def VersionCode() {
    try {
        def p = "git describe --tags --always"
        def process = p.execute()
        process.waitFor()
        if (process.exitValue() != 0) throw new IllegalStateException("git describe failed")
        def replace = [v: "", ".": " ", "-": " "]
        def arr = (process.text.trim().replace(replace) + " 0").split(" ")
        def versionCode = arr[0].toInteger() * 16777216 + arr[1].toInteger() * 65536 + arr[2].toInteger() * 256 + arr[3].toInteger()
        println("VersionCode $versionCode")
        return versionCode
    } catch (Exception e) {
        throw new GradleException("Unable to derive versionCode from git tags", e)
    }
}

static def VersionName() {
    try {
        def process = "git describe --tags --always".execute()
        process.waitFor()
        if (process.exitValue() != 0) throw new IllegalStateException("git describe failed")
        return process.text.trim() - "v"
    } catch (Exception e) {
        throw new GradleException("Unable to derive versionName from git tags", e)
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Media3 1.2.1 retains API 18 compatibility; no PlayerView/UI dependency.
    implementation "androidx.media3:media3-exoplayer:1.2.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.2.1"

    // Gson 2.10.1 ReflectionHelper fails Dalvik verification on API 18.
    implementation 'com.google.code.gson:gson:2.8.9'
    // OkHttp 3.13+ requires Android 5; keep the Android 4.x branch.
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // Keep the existing Fragment/Core/Lifecycle versions for Android 4.x.
    implementation 'androidx.fragment:fragment:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.11.0'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"

    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0-RC")

}
